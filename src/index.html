<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Flight Sim</title>
    <link rel="stylesheet" href="./bundle.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./bundle.js"></script>
</head>

<body>
    <div id="container"></div>
    <div id="boot-progress">
        <div id="boot-progress-dialog">
            <h2>Retro Flight Sim</h2>
            <div id="boot-progress-label">Loading...</div>
            <div id="boot-progress-track">
                <div id="boot-progress-fill"></div>
            </div>
        </div>
    </div>
    <div id="mod-status" class="hidden"></div>
    <div id="showcase-pick" class="hidden"></div>
    <div id="spawn-panel" class="hidden">
        <div id="spawn-dialog">
            <h2 id="spawn-title">Retro Flight Sim</h2>
            <label for="aircraft-select">Aircraft</label>
            <select id="aircraft-select"></select>
            <label for="livery-select" id="livery-label">Livery</label>
            <select id="livery-select"></select>
            <label for="airfield-select" id="airfield-label">Airfield</label>
            <select id="airfield-select"></select>
            <div id="spawn-actions">
                <button type="button" id="spawn-approach">Approach (1)</button>
                <button type="button" id="spawn-runway">Runway (2)</button>
                <button type="button" id="spawn-headon">Head-on (3)</button>
                <button type="button" id="spawn-carrier">Carrier land (4)</button>
                <button type="button" id="spawn-carrier-takeoff">Carrier TO (5)</button>
                <button type="button" id="spawn-carrier-barricade">Carrier barricade (8)</button>
                <button type="button" id="spawn-high-alt">10 km (6)</button>
                <button type="button" id="spawn-space">Space (7)</button>
            </div>
        </div>
    </div>
    <div id="settings-button" title="Settings and help">⋮</div>
</body>

</html>
